services:
  khatam-institute:
    build:
      context: .
      dockerfile: Dockerfile
    image: khatam-institute:latest
    container_name: khatam_institute_app
    restart: unless-stopped
    ports:
      - "${PORT:-7575}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-khatam-institute-super-secret-production-key}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DATA_DIR=/app/data
    volumes:
      # Persist SQLite database in dedicated data directory
      - ./data:/app/data
      # Persist user uploads
      - ./public/uploads:/app/public/uploads
